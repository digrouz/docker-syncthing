## @section Kubernetes settings
##
image:
  ## @param image.registry syncthing image registry
  ##
  registry: docker.io
  ## @param image.repository syncthing image repository
  ##
  repository: digrouz/syncthing
  ##
  ## @param image.tag syncthing image tag
  ## Ref: https://hub.docker.com/r/digrouz/syncthing/tags
  ##
  tag: "latest"
  ## @param image.pullPolicy syncthing image pull policy
  ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
  ##
  pullPolicy: Always
## @section Service Configuration
##
service:
  ## @param service.uid user id running syncthing
  ##
  uid: 12345
  ## @param service.gid group id running syncthing
  ##
  gid: 12345
  ## @param service.autoupgrade apply OS updates inside container at startup
  ##
  autoupgrade: 0
  ## @param service.tz Time Zone
  ##
  tz: Europe/Brussels
ingress:
  ## @param ingress.ingressClassName Ingress class name for syncthing ingress
  ##
  ingressClassName: traefik
  ## @param Ingress configuration for syncthing webui ingress
  ##
  webui:
    ## @param ingress.webui.enabled Enable ingress for syncthing webui
    ##
    enabled: true
    ## @param ingress.webui.ingressClassName Ingress class name for syncthing webui ingress
    ##
    ingressClassName: traefik
    ## @param ingress.webui.host Host for syncthing webui ingress
    ##
    host: ""
    ## @param ingress.webui.tls Enable TLS for syncthing webui ingress
    ##
    tls: true
    ## @param ingress.webui.annotations Annotations for syncthing webui ingress
    ##
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: ""
      cert-manager.io/cluster-issuer: letsencrypt-prod
  ## @param Ingress configuration for syncthing sync TCP ingress
  ##
  sync:
    ## @param ingress.sync.enabled Enable ingress for syncthing sync TCP
    ##
    enabled: false
    ## @param ingress.sync.traefik.entrypoint Traefik entrypoint for syncthing sync TCP ingress
    ##
    traefik:
      entrypoint: tcp-sync
    ## @param ingress.sync.weight Weight for syncthing sync TCP ingress
    ##
    priority: 10
  ## @param Ingress configuration for syncthing discovery UDP ingress
  ##
  discovery:
    ## @param ingress.discovery.enabled Enable ingress for syncthing discovery UDP
    ##
    enabled: false
    ## @param ingress.discovery.traefik.entrypoint Traefik entrypoint for syncthing discovery UDP ingress
    ##
    traefik:
      entrypoint: udp-discovery
    ## @param ingress.discovery.weight Weight for syncthing discovery UDP ingress
    ##
    weight: 10
## @section Storage persistence Configuration
##
persistence:
  config:
    ## @param persistence.config.type Type of persistence for syncthing config
    ## If set to pvc, a persistent volume claim will be created
    ## If set to nfs, a network file system will be used
    ##
    type: pvc
    ## Specific persistence options for syncthing config using a persistent volume claim
    ##
    pvc:
      ## @param persistence.config.pvc.storageClass Storage class for syncthing config
      ## If not set, the default storage class will be used
      ##
      storageClass: longhorn
      ## @param persistence.config.pvc.existingClaim Existing persistent volume claim for syncthing config
      ## If set, the config will be stored in the existing persistent volume claim
      ##
      accessMode: ReadWriteOnce
      ## @param persistence.config.pvc.size Size of the persistent volume for syncthing config
      ## If not set, the default size will be used
      ##
      size: 1Gi
    ## Specific persistence options for syncthing config using NFS
    ##      
    nfs:
      ## @param persistence.config.nfs.server NFS server for syncthing config
      ## If not set, the default NFS server will be used
      ##
      server: ""
      ## @param persistence.config.nfs.path NFS path for syncthing config
      ## If not set, the default NFS path will be used
      ##
      path: ""
  syncdata:
    ## @param persistence.syncdata.type Type of persistence for syncthing syncdata
    ## If set to pvc, a persistent volume claim will be created
    ## If set to nfs, a network file system will be used
    ##
    type: pvc
    ## Specific persistence options for syncthing syncdata using a persistent volume claim
    ##
    pvc:
      ## @param persistence.syncdata.pvc.storageClass Storage class for syncthing syncdata
      ## If not set, the default storage class will be used
      ##
      storageClass: longhorn
      ## @param persistence.syncdata.pvc.accessMode Access mode for syncthing syncdata
      ## If not set, the default access mode will be used
      ##
      accessMode: ReadWriteOnce
      ## @param persistence.syncdata.pvc.size Size of the persistent volume for syncthing syncdata
      ## If not set, the default size will be used
      ##
      size: 5Gi
    ## Specific persistence options for syncthing syncdata using NFS
    ##      
    nfs:
      ## @param persistence.syncdata.nfs.server NFS server for syncthing syncdata
      ## If not set, the default NFS server will be used
      ##
      server: ""
      ## @param persistence.syncdata.nfs.path NFS path for syncthing syncdata
      ## If not set, the default NFS path will be used
      ##
      path: ""
  ## Extra volumes to be mounted into the Pod
  ## Example:
  ## extraVolumes:
  ##   - name: my-config
  ##     configMap:
  ##       name: my-configmap
  extraVolumes: []
  ## Extra volumeMounts to add to the syncthing container
  ## Example:
  ## extraVolumeMounts:
  ##   - name: my-config
  ##     mountPath: /etc/my-config
  extraVolumeMounts: []
extraObjects: []



