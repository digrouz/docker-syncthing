{{- if gt (int .Values.replicaCount) 1 }}
{{- fail (printf "syncthing is a single-instance application: replicaCount must be 1 (got %v)" .Values.replicaCount) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "syncthing.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "syncthing.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "syncthing.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "syncthing.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: syncthing
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.image.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: webui
              containerPort: 8384
              protocol: TCP
            - name: synctcp
              containerPort: 22000
              protocol: TCP
            - name: syncudp
              containerPort: 22000
              protocol: UDP
            - name: discovery
              containerPort: 21027
              protocol: UDP
          {{- if .Values.securityContext }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            {{- if .Values.securityContext.seccompProfile }}
            seccompProfile:
              type: {{ .Values.securityContext.seccompProfile }}
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /rest/noauth/health
              port: 8384
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /rest/noauth/health
              port: 8384
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /rest/noauth/health
              port: 8384
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - mountPath: /config
              name: syncthing-config
            - mountPath: /home/appuser/Sync
              name: syncthing-syncdata
{{- if .Values.persistence.extraVolumeMounts }}
{{- toYaml .Values.persistence.extraVolumeMounts | nindent 12 }}
{{- end }}
          env:
            - name: GID
              value: "{{ .Values.service.gid }}"
            - name: UID
              value: "{{ .Values.service.uid }}"
            - name: TZ
              value: "{{ .Values.service.tz }}"
            - name: AUTOUPGRADE
              value: "{{ .Values.service.autoupgrade }}"
      volumes:
        - name: syncthing-config
          {{- if eq .Values.persistence.config.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.config.pvc.existingClaim | default (printf "%s-config-pvc" (include "syncthing.fullname" .)) | quote }}
          {{- else if eq .Values.persistence.config.type "nfs" }}
          nfs:
            server: {{ .Values.persistence.config.nfs.server | quote }}
            path: {{ .Values.persistence.config.nfs.path | quote }}
          {{- else if eq .Values.persistence.config.type "emptyDir" }}
          emptyDir: { }
          {{- else }}
          {{- fail (printf "persistence.config.type must be one of [pvc, nfs, emptyDir], got %q" .Values.persistence.config.type) }}
          {{- end }}
        - name: syncthing-syncdata
          {{- if eq .Values.persistence.syncdata.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.syncdata.pvc.existingClaim | default (printf "%s-syncdata-pvc" (include "syncthing.fullname" .)) | quote }}
          {{- else if eq .Values.persistence.syncdata.type "nfs" }}
          nfs:
            server: {{ .Values.persistence.syncdata.nfs.server | quote }}
            path: {{ .Values.persistence.syncdata.nfs.path | quote }}
          {{- else if eq .Values.persistence.syncdata.type "emptyDir" }}
          emptyDir: { }
          {{- else }}
          {{- fail (printf "persistence.syncdata.type must be one of [pvc, nfs, emptyDir], got %q" .Values.persistence.syncdata.type) }}
          {{- end }}
{{- if .Values.persistence.extraVolumes }}
{{- toYaml .Values.persistence.extraVolumes | nindent 8 }}
{{- end }}
