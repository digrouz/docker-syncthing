## @section Kubernetes settings
##
nameOverride: ""
fullnameOverride: ""
image:
  ## @param image.registry syncthing image registry
  ##
  registry: docker.io
  ## @param image.repository syncthing image repository
  ##
  repository: digrouz/syncthing
  ##
  ## @param image.tag syncthing image tag
  ## Ref: https://hub.docker.com/r/digrouz/syncthing/tags
  ## Note: the CI workflow currently only publishes the `latest` and `alpine` tags.
  ## For a reproducible deploy, push a versioned tag (e.g. 2.1.3) and use it here.
  ##
  tag: "alpine"
  ## @param image.pullPolicy syncthing image pull policy
  ## ref: https://kubernetes.io/docs/user-guide/images/#pre-pulling-images
  ##
  pullPolicy: Always
  ## @param image.resources Requests and limits for syncthing container
  ##
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
## @section Deployment Configuration
##
## @param replicaCount Number of syncthing replicas.
## Must be 1: syncthing is a single-instance application and the volumes use ReadWriteOnce access.
replicaCount: 1
podAnnotations: {}
podLabels: {}
## @section Security Configuration
##
## @param securityContext.allowPrivilegeEscalation Set no_new_privs on the syncthing container
## @param securityContext.seccompProfile Seccomp profile for the syncthing container (RuntimeDefault, Localhost or Unconfined)
##
## Note: runAsUser / runAsNonRoot are intentionally not set. The s6-overlay entrypoint
## starts as root and drops privileges to appuser (s6-setuidgid), and the fixattrs
## service needs root to chown the config volume.
securityContext:
  allowPrivilegeEscalation: false
  seccompProfile: RuntimeDefault
## @section Service Configuration
##
service:
  ## @param service.type Kubernetes Service type (ClusterIP, NodePort or LoadBalancer)
  ##
  type: ClusterIP
  ## @param service.uid user id running syncthing
  ##
  uid: 12345
  ## @param service.gid group id running syncthing
  ##
  gid: 12345
  ## @param service.autoupgrade apply OS updates inside container at startup
  ##
  autoupgrade: 0
  ## @param service.tz Time Zone
  ##
  tz: Europe/Brussels
ingress:
  ## @param ingress.ingressClassName Ingress class name for syncthing ingress
  ##
  ingressClassName: traefik
  ## @param Ingress configuration for syncthing webui ingress
  ##
  webui:
    ## @param ingress.webui.enabled Enable ingress for syncthing webui
    ##
    enabled: true
    ## @param ingress.webui.host Host for syncthing webui ingress
    ##
    host: ""
    ## @param ingress.webui.tls Enable TLS for syncthing webui ingress
    ##
    tls: true
    ## @param ingress.webui.tlsSecretName Name of the existing TLS secret for the webui ingress
    ## If empty, "<ingress.webui.host>-tls" is used (cert-manager convention)
    ##
    tlsSecretName: ""
    ## @param ingress.webui.annotations Annotations for syncthing webui ingress
    ## Note: the Syncthing GUI only authenticates with its own credentials.
    ## When exposing the webui beyond your LAN, configure an auth middleware here
    ## (e.g. router.middlewares pointing to a basic-auth/oauth middleware).
    ##
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: ""
      cert-manager.io/cluster-issuer: letsencrypt-prod
  ## @param Ingress configuration for syncthing sync TCP ingress
  ##
  synctcp:
    ## @param ingress.synctcp.enabled Enable ingress for syncthing sync TCP
    ##
    enabled: false
    ## @param ingress.synctcp.traefik.entrypoint Traefik entrypoint for syncthing sync TCP ingress
    ##
    traefik:
      entrypoint: tcp-sync
    ## @param ingress.synctcp.weight Weight for syncthing sync TCP ingress
    ##
    priority: 10
  ## @param Ingress configuration for syncthing sync UDP ingress
  ##
  syncudp:
    ## @param ingress.syncudp.enabled Enable ingress for syncthing sync UDP
    ##
    enabled: false
    ## @param ingress.syncudp.traefik.entrypoint Traefik entrypoint for syncthing sync UDP ingress
    ##
    traefik:
      entrypoint: udp-sync
    ## @param ingress.syncudp.weight Weight for syncthing sync UDP ingress
    ##
    weight: 10
  ## @param Ingress configuration for syncthing discovery UDP ingress
  ##
  discovery:
    ## @param ingress.discovery.enabled Enable ingress for syncthing discovery UDP
    ##
    enabled: false
    ## @param ingress.discovery.traefik.entrypoint Traefik entrypoint for syncthing discovery UDP ingress
    ##
    traefik:
      entrypoint: udp-discovery
    ## @param ingress.discovery.weight Weight for syncthing discovery UDP ingress
    ##
    weight: 10
## @section Storage persistence Configuration
##
persistence:
  config:
    ## @param persistence.config.type Type of persistence for syncthing config
    ## If set to pvc, a persistent volume claim will be created (unless an existingClaim is provided)
    ## If set to nfs, a network file system will be used
    ## If set to emptyDir, a temporary volume will be used (data is lost on pod restart)
    ##
    type: pvc
    ## Specific persistence options for syncthing config using a persistent volume claim
    ##
    pvc:
      ## @param persistence.config.pvc.storageClass Storage class for syncthing config
      ## If not set, the default storage class will be used
      ##
      storageClass: longhorn
      ## @param persistence.config.pvc.existingClaim Existing persistent volume claim for syncthing config
      ## If set, the config will be stored in the existing persistent volume claim
      ## and no new PVC will be created
      ##
      existingClaim: ""
      ## @param persistence.config.pvc.accessMode Access mode for syncthing config
      ##
      accessMode: ReadWriteOnce
      ## @param persistence.config.pvc.size Size of the persistent volume for syncthing config
      ## If not set, the default size will be used
      ##
      size: 1Gi
    ## Specific persistence options for syncthing config using NFS
    ##      
    nfs:
      ## @param persistence.config.nfs.server NFS server for syncthing config
      ## If not set, the default NFS server will be used
      ##
      server: ""
      ## @param persistence.config.nfs.path NFS path for syncthing config
      ## If not set, the default NFS path will be used
      ##
      path: ""
  syncdata:
    ## @param persistence.syncdata.type Type of persistence for syncthing syncdata
    ## If set to pvc, a persistent volume claim will be created (unless an existingClaim is provided)
    ## If set to nfs, a network file system will be used
    ## If set to emptyDir, a temporary volume will be used (data is lost on pod restart)
    ##
    type: pvc
    ## Specific persistence options for syncthing syncdata using a persistent volume claim
    ##
    pvc:
      ## @param persistence.syncdata.pvc.storageClass Storage class for syncthing syncdata
      ## If not set, the default storage class will be used
      ##
      storageClass: longhorn
      ## @param persistence.syncdata.pvc.existingClaim Existing persistent volume claim for syncthing syncdata
      ## If set, the syncdata will be stored in the existing persistent volume claim
      ## and no new PVC will be created
      ##
      existingClaim: ""
      ## @param persistence.syncdata.pvc.accessMode Access mode for syncthing syncdata
      ## If not set, the default access mode will be used
      ##
      accessMode: ReadWriteOnce
      ## @param persistence.syncdata.pvc.size Size of the persistent volume for syncthing syncdata
      ## If not set, the default size will be used
      ##
      size: 5Gi
    ## Specific persistence options for syncthing syncdata using NFS
    ##      
    nfs:
      ## @param persistence.syncdata.nfs.server NFS server for syncthing syncdata
      ## If not set, the default NFS server will be used
      ##
      server: ""
      ## @param persistence.syncdata.nfs.path NFS path for syncthing syncdata
      ## If not set, the default NFS path will be used
      ##
      path: ""
  ## Extra volumes to be mounted into the Pod
  ## Example:
  ## extraVolumes:
  ##   - name: my-config
  ##     configMap:
  ##       name: my-configmap
  extraVolumes: []
  ## Extra volumeMounts to add to the syncthing container
  ## Example:
  ## extraVolumeMounts:
  ##   - name: my-config
  ##     mountPath: /etc/my-config
  extraVolumeMounts: []
extraObjects: []
