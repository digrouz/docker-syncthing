---
kind: Service
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-svc
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: syncthing
spec:
  ports:
  - port: 8384
    name: webui
    protocol: TCP
  - port: 22000
    name: sync
    protocol: TCP
  - port: 21027
    name: discovery
    protocol: UDP
  selector:
    app.kubernetes.io/component: syncthing
