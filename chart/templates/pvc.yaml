{{- if eq .Values.persistence.config.type "pvc" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "syncthing.fullname" . }}-config-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "syncthing.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.config.pvc.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.config.pvc.size | quote }}
  {{- if .Values.persistence.config.pvc.storageClass }}
  storageClassName: {{ .Values.persistence.config.pvc.storageClass | quote }}
  {{- end }}
{{- end }}
--- 
{{- if eq .Values.persistence.syncdata.type "pvc" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "syncthing.fullname" . }}-syncdata-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "syncthing.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.syncdata.pvc.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.syncdata.pvc.size | quote }}
  {{- if .Values.persistence.syncdata.pvc.storageClass }}
  storageClassName: {{ .Values.persistence.syncdata.pvc.storageClass | quote }}
  {{- end }}
{{- end }} 

